[project]
name = "rag-tradeai"
version = "0.1.0"
description = "A project for utilizing RAG in organizations;"
readme = "README.md"
authors = [
    { name = "Arya", email = "aryasoltaniprogramming@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "gradio>=6.31.0",
    "ipykernel>=7.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.5",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-tradeai = "rag_tradeai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
